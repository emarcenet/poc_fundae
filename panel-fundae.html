<div id="fundae-panel">Cargando panel de evidencias…</div>

<script>
/* ============================================================
 * PoC panel FUNDAE — Moodle 4.5 / 5, sin plugins. REST con token.
 * Funciones necesarias en el servicio externo (ver README):
 *   core_course_get_courses_by_field, core_course_get_contents,
 *   core_enrol_get_enrolled_users, core_completion_get_course_completion_status,
 *   gradereport_user_get_grade_items,
 *   core_completion_get_activities_completion_status (opcional: % progreso)
 *
 * Tiempo de conexión: calculado desde report/log (descarga JSON) con
 * la sesión del tutor que ve la página (permiso report/log:view).
 * Sesión = eventos consecutivos con huecos < SESSION_GAP_MIN minutos.
 *
 * NOTA: todo el CSS y el esqueleto HTML se generan desde JS porque
 * el editor de Moodle elimina las etiquetas <style> al guardar.
 * ============================================================ */
/* SEGURIDAD: el panel NO lleva ningún token incrustado en el código.
 * Cada tutor se conecta con su token PERSONAL del servicio SERVICE_NAME,
 * que se guarda solo en SU navegador y consulta la API con sus propios
 * permisos: si se filtra, no concede más acceso del que ese tutor ya tiene.
 *
 * La generación del token NUNCA es automática: regenerarlo invalida el
 * anterior, así que es una acción destructiva y requiere un clic explícito
 * del tutor. El panel solo toca el token del servicio SERVICE_NAME; si no
 * existe una fila para ese servicio, no toca ningún otro token.
 *
 * DATOS PERSONALES: el panel muestra y exporta nombre, correo y patrón
 * horario de conexión del alumnado. Ver la sección RGPD del README antes
 * de distribuir los CSV que genera. */

/* ------------------------------------------------------------------ */
/* Configuración                                                       */
/* ------------------------------------------------------------------ */

var SERVICE_NAME = 'FUNDAE PoC'; // nombre EXACTO del servicio externo en Moodle
var MAX_ALUMNOS = 100;     // límite de alumnos consultados en la PoC
var SESSION_GAP_MIN = 30;  // minutos de inactividad que cierran una sesión
var SESSION_MIN_SEC = 60;  // tiempo atribuido a una sesión de un solo evento
var CONCURRENCY = 5;       // peticiones simultáneas máximas contra Moodle
var RETRIES = 3;           // reintentos ante error de red o 429/5xx

// Shortnames de rol que se consideran alumnado. Se amplía aquí cuando el
// cliente ha renombrado o clonado el rol (habitual en instalaciones en
// español); además se acepta cualquier rol cuyo shortname empiece por
// «student» o «alumn».
var STUDENT_ROLES = ['student', 'alumno', 'alumna', 'alumnado', 'estudiante'];

var TOKEN_KEY = 'fundae_wstoken';
var TOKEN_MODE_KEY = 'fundae_wstoken_mode'; // 'local' | 'session'

/* ------------------------------------------------------------------ */
/* Almacenamiento del token                                            */
/* ------------------------------------------------------------------ */

// Por defecto el token vive en localStorage: es el ÚNICO almacenamiento
// compartido entre pestañas. Con sessionStorage cada pestaña arrancaría sin
// token y regeneraría el suyo, invalidando el de las demás. Marcar «solo
// esta sesión» lo devuelve a sessionStorage a cambio de reconectar a diario.
// El modelo de amenazas no cambia: un XSS lee ambos por igual (README).
function getToken() {
  try { return localStorage.getItem(TOKEN_KEY) || sessionStorage.getItem(TOKEN_KEY) || ''; } catch (e) { return ''; }
}
function setToken(t, sessionOnly) {
  try {
    sessionStorage.removeItem(TOKEN_KEY);
    localStorage.removeItem(TOKEN_KEY);
    if (t) {
      (sessionOnly ? sessionStorage : localStorage).setItem(TOKEN_KEY, t);
      localStorage.setItem(TOKEN_MODE_KEY, sessionOnly ? 'session' : 'local');
    }
  } catch (e) { /* almacenamiento bloqueado: el panel seguirá pidiendo el token */ }
}

var fundaeData = {
  students: [], sortKey: 'name', sortDir: 1, expanded: {}, expandedType: {},
  dateOrder: null, csvWarned: false
};

/* ------------------------------------------------------------------ */
/* Utilidades                                                          */
/* ------------------------------------------------------------------ */

// Escapa también la comilla simple y la barra: el panel construye HTML por
// concatenación y algunos atributos podrían usar comillas simples.
function esc(s) {
  return String(s == null ? '' : s).replace(/[&<>"'/]/g, function (c) {
    return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;', '/': '&#47;' }[c];
  });
}
function fmtDate(ts) { return ts ? new Date(ts * 1000).toLocaleString() : '—'; }
function fmtDay(ts) { return ts ? new Date(ts * 1000).toLocaleDateString() : '—'; }
function fmtDur(sec) {
  if (sec == null) return 'n/d';
  var h = Math.floor(sec / 3600), m = Math.round((sec % 3600) / 60);
  return h + 'h ' + (m < 10 ? '0' : '') + m + 'm';
}
function avatar(name) {
  var colors = ['#0f6cbf', '#5b3fc5', '#188070', '#b3550e', '#a02b56', '#356ac0', '#6a4f9e'];
  var h = 0;
  for (var i = 0; i < name.length; i++) h = (h * 31 + name.charCodeAt(i)) % 9973;
  var parts = name.trim().split(/\s+/);
  var ini = (parts[0] ? parts[0][0] : '?') + (parts[1] ? parts[1][0] : '');
  return '<span class="fp-av" aria-hidden="true" style="background:' + colors[h % colors.length] + '">' +
    esc(ini.toUpperCase()) + '</span>';
}
function car(open) {
  return '<span class="fp-car' + (open ? ' open' : '') + '" aria-hidden="true">▸</span> ';
}
// Emoji decorativo: se oculta a los lectores de pantalla, que ya leen el texto.
function ic(e) { return '<span aria-hidden="true">' + e + '</span>'; }

// Pool de concurrencia: evita lanzar cientos de peticiones a la vez contra
// Moodle. Las descargas de report/log son consultas caras; sin límite, un
// curso de 100 alumnos puede dejar el sitio sin responder.
function fundaePool(items, worker, limit, onProgress) {
  var results = new Array(items.length);
  var next = 0, done = 0, active = 0;
  return new Promise(function (resolve) {
    if (!items.length) return resolve(results);
    function run(i) {
      Promise.resolve()
        .then(function () { return worker(items[i], i); })
        .then(function (v) { results[i] = v; }, function () { results[i] = null; })
        .then(function () {
          active--; done++;
          if (onProgress) onProgress(done, items.length);
          if (done === items.length) resolve(results); else launch();
        });
    }
    function launch() {
      while (active < limit && next < items.length) { active++; run(next++); }
    }
    launch();
  });
}

// Reintento con espera creciente. Los errores lógicos de Moodle
// (accessexception, invalidtoken…) se marcan fatales y no se reintentan.
function fundaeRetry(fn, tries, delay) {
  return fn().catch(function (e) {
    if (tries <= 1 || (e && e.fatal)) throw e;
    return new Promise(function (r) { setTimeout(r, delay); })
      .then(function () { return fundaeRetry(fn, tries - 1, delay * 2); });
  });
}

/* ------------------------------------------------------------------ */
/* Acceso a Moodle                                                     */
/* ------------------------------------------------------------------ */

// M.cfg.courseId es la vía directa; el resto son respaldos por si un tema
// o una versión no lo expone.
function fundaeCourseId() {
  if (typeof M !== 'undefined' && M.cfg && M.cfg.courseId) {
    var id = parseInt(M.cfg.courseId, 10);
    if (id > 1) return id; // 1 = portada del sitio, no es un curso
  }
  var m = location.pathname.match(/course\/view\.php/) && location.search.match(/[?&]id=(\d+)/);
  if (m) return parseInt(m[1], 10);
  var bc = document.body.className.match(/course-(\d+)/);
  if (bc) return parseInt(bc[1], 10);
  return null;
}

function ws(fn, args) {
  return fundaeRetry(function () {
    var body = new URLSearchParams();
    body.set('wstoken', getToken());
    body.set('wsfunction', fn);
    body.set('moodlewsrestformat', 'json');
    Object.keys(args || {}).forEach(function (k) { body.set(k, args[k]); });
    return fetch(M.cfg.wwwroot + '/webservice/rest/server.php', {
      method: 'POST',
      headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
      body: body.toString()
    }).then(function (r) {
      if (!r.ok) { var he = new Error('HTTP ' + r.status); he.status = r.status; throw he; }
      return r.json();
    }).then(function (j) {
      if (j && j.exception) {
        var err = new Error(j.message || j.errorcode);
        err.errorcode = j.errorcode || '';
        err.fatal = true; // error lógico: reintentar no cambia nada
        throw err;
      }
      return j;
    });
  }, RETRIES, 500);
}

// Comprueba si quien ve la página puede ver los registros del curso.
// Sirve para dos cosas: saber si podremos calcular tiempos, y como guarda
// de rol — el alumnado no tiene report/log:view, así que no debe llegar a
// ver la pantalla de conexión ni generar tokens.
function fundaeCanViewLogs(courseid) {
  return fetch(M.cfg.wwwroot + '/report/log/index.php?id=' + courseid, { credentials: 'same-origin' })
    .then(function (r) { return r.text(); })
    .then(function (html) { return html.indexOf('logreader') >= 0 || html.indexOf('chooselog') >= 0; })
    .catch(function () { return false; });
}

/* --- Registros: descarga y análisis --------------------------------- */

// Devuelve las partes de fecha sin interpretar (ver fundaeResolveDateOrder):
// no se puede decidir aún si «03/07» es 3 de julio o 7 de marzo.
function fundaeLogParts(courseid, userid) {
  var p = new URLSearchParams({
    chooselog: 1, id: courseid, user: userid, date: 0,
    modid: '', modaction: '', origin: '', edulevel: -1,
    logreader: 'logstore_standard', download: 'json'
  });
  return fetch(M.cfg.wwwroot + '/report/log/index.php?' + p.toString(), { credentials: 'same-origin' })
    .then(function (r) { return r.text(); })
    .then(function (txt) {
      var rows;
      try { rows = JSON.parse(txt); } catch (e) { return null; } // sin permiso → HTML, no JSON
      if (!Array.isArray(rows)) return null;
      var out = [];
      rows.forEach(function (row) {
        var parts = fundaeParseLogValue(fundaeTimeCell(row));
        if (parts) out.push(parts);
      });
      return out;
    })
    .catch(function () { return null; });
}

// Localiza la columna de hora por el NOMBRE de la cabecera. Depender de la
// posición rompía en cuanto el informe cambiaba de columnas.
function fundaeTimeCell(row) {
  var keys = Object.keys(row || {});
  for (var i = 0; i < keys.length; i++) {
    if (/hora|time|fecha|date|zeit|heure/i.test(keys[i])) return row[keys[i]];
  }
  return keys.length ? row[keys[0]] : '';
}

// Analiza un valor de fecha del informe SIN resolver el orden día/mes.
// Acepta ISO (aaaa-mm-dd) y los formatos numéricos con barra o guion.
function fundaeParseLogValue(v) {
  var s = String(v == null ? '' : v);
  var iso = s.match(/(\d{4})-(\d{1,2})-(\d{1,2})\D+(\d{1,2}):(\d{2})(?::(\d{2}))?/);
  if (iso) {
    return {
      iso: true, y: +iso[1], mo: +iso[2], d: +iso[3],
      h: +iso[4], mi: +iso[5], s: +(iso[6] || 0)
    };
  }
  var m = s.match(/(\d{1,2})[/\-.](\d{1,2})[/\-.](\d{2,4})\D+(\d{1,2}):(\d{2})(?::(\d{2}))?/);
  if (!m) return null;
  var y = +m[3]; if (y < 100) y += 2000;
  return { iso: false, a: +m[1], b: +m[2], y: y, h: +m[4], mi: +m[5], s: +(m[6] || 0) };
}

// Decide si el informe viene en d/m/aa o en m/d/aa mirando TODO el conjunto:
// un valor mayor que 12 en una posición la fija como día. Si ningún valor lo
// desambigua, se asume d/m (Moodle en español) pero se marca `ambiguous` y el
// panel avisa de que la estimación no está verificada. Preferimos declarar la
// duda a publicar horas que parecen buenas y no lo son.
function fundaeResolveDateOrder(partsList) {
  var aOver = false, bOver = false, seen = false;
  (partsList || []).forEach(function (parts) {
    (parts || []).forEach(function (p) {
      if (!p || p.iso) return;
      seen = true;
      if (p.a > 12) aOver = true;
      if (p.b > 12) bOver = true;
    });
  });
  if (aOver && !bOver) return { dayFirst: true, ambiguous: false };
  if (bOver && !aOver) return { dayFirst: false, ambiguous: false };
  // Ni un solo valor por encima de 12 (o ambos): no hay evidencia suficiente.
  return { dayFirst: true, ambiguous: seen };
}

function fundaePartsToTs(parts, dayFirst) {
  return (parts || []).map(function (p) {
    var d = p.iso ? p.d : (dayFirst ? p.a : p.b);
    var mo = p.iso ? p.mo : (dayFirst ? p.b : p.a);
    return new Date(p.y, mo - 1, d, p.h, p.mi, p.s).getTime() / 1000;
  });
}

// Reconstruye sesiones a partir de timestamps con el umbral de inactividad.
// A cada sesión se le suma SESSION_MIN_SEC: la duración bruta (último evento
// menos primero) da CERO cuando la sesión tiene un único evento registrado,
// lo que infravaloraba de forma sistemática las horas acreditadas.
function fundaeSessions(ts) {
  if (!ts || !ts.length) return { seconds: 0, sessions: 0, list: [] };
  ts = ts.slice().sort(function (a, b) { return a - b; });
  var gap = SESSION_GAP_MIN * 60;
  var list = [], start = ts[0], prev = ts[0];
  function push(a, b) { list.push({ start: a, end: b, seconds: (b - a) + SESSION_MIN_SEC }); }
  for (var i = 1; i < ts.length; i++) {
    if (ts[i] - prev > gap) { push(start, prev); start = ts[i]; }
    prev = ts[i];
  }
  push(start, prev);
  var total = list.reduce(function (a, sn) { return a + sn.seconds; }, 0);
  return { seconds: total, sessions: list.length, list: list };
}

// Agrupa las sesiones por día natural (clave aaaa-mm-dd, por fecha de inicio).
function fundaeByDay(list) {
  var days = {};
  (list || []).forEach(function (sn) {
    var d = new Date(sn.start * 1000);
    var key = d.getFullYear() + '-' + ('0' + (d.getMonth() + 1)).slice(-2) + '-' + ('0' + d.getDate()).slice(-2);
    if (!days[key]) days[key] = { day: key, seconds: 0, sessions: 0 };
    days[key].seconds += sn.seconds;
    days[key].sessions++;
  });
  return Object.keys(days).sort().map(function (k) { return days[k]; });
}

/* ------------------------------------------------------------------ */
/* Carga de datos                                                      */
/* ------------------------------------------------------------------ */

function fundaeIsStudent(u) {
  return (u.roles || []).some(function (r) {
    var sn = String(r.shortname || '').toLowerCase();
    return STUDENT_ROLES.indexOf(sn) >= 0 || sn.indexOf('student') === 0 || sn.indexOf('alumn') === 0;
  });
}

function fundaeLoading(txt, sub) {
  document.getElementById('fp-body').innerHTML =
    '<div class="card fp-card"><div class="card-body" style="text-align:center;padding:48px 20px;">' +
    '<div class="spinner-border text-primary" role="status" style="margin-bottom:10px;"></div>' +
    '<div class="fp-muted" id="fp-loading-txt">' + esc(txt) + '</div>' +
    '<div class="fp-muted" id="fp-loading-sub" style="font-size:.8em;">' + esc(sub || '') + '</div>' +
    '</div></div>';
}

function fundaeRun() {
  var out = document.getElementById('fp-body');
  var courseid = fundaeCourseId();
  if (!courseid) { out.innerHTML = '<div class="fp-error">No se ha podido detectar el id del curso.</div>'; return; }
  if (!getToken()) { fundaeConnectScreen(); return; }

  fundaeLoading('Consultando API y registros del curso…');

  var course, contents, grades, rawStudents, canLogs = false;

  fundaeCanViewLogs(courseid)
    .then(function (ok) {
      canLogs = ok;
      return ws('core_course_get_courses_by_field', { field: 'id', value: String(courseid) });
    })
    .then(function (r) {
      course = r.courses && r.courses[0];
      if (!course) throw new Error('Curso no encontrado o sin permisos.');
      return Promise.all([
        ws('core_enrol_get_enrolled_users', { courseid: courseid }),
        ws('core_course_get_contents', { courseid: courseid }),
        ws('gradereport_user_get_grade_items', { courseid: courseid })
      ]);
    })
    .then(function (rs) {
      contents = rs[1]; grades = rs[2];
      rawStudents = rs[0].filter(fundaeIsStudent);
      var sample = rawStudents.slice(0, MAX_ALUMNOS);

      // Pool con concurrencia limitada + progreso visible: cada alumno son
      // 2 llamadas a la API y una descarga de registros.
      return fundaePool(sample, function (u) {
        var pCourse = ws('core_completion_get_course_completion_status', { courseid: courseid, userid: u.id })
          .then(function (r) { return r.completionstatus; }).catch(function () { return null; });
        var pActs = ws('core_completion_get_activities_completion_status', { courseid: courseid, userid: u.id })
          .then(function (r) { return r.statuses || []; }).catch(function () { return null; });
        var pLogs = canLogs ? fundaeLogParts(courseid, u.id) : Promise.resolve(null);
        return Promise.all([pCourse, pActs, pLogs]).then(function (pr) {
          return { user: u, completion: pr[0], actstatuses: pr[1], logparts: pr[2] };
        });
      }, CONCURRENCY, function (done, total) {
        var el = document.getElementById('fp-loading-sub');
        if (el) el.textContent = done + ' / ' + total + ' alumnos';
      });
    })
    .then(function (perStudent) {
      fundaeBuild(course, rawStudents, perStudent.filter(Boolean), contents, grades, canLogs);
    })
    .catch(function (e) {
      if (e.errorcode === 'invalidtoken') {
        // Token caducado o revocado: se borra del navegador y se pide de nuevo.
        setToken('');
        fundaeConnectScreen('El token guardado ya no es válido (caducado o revocado). Vuelve a conectar.');
        return;
      }
      var hint = '';
      if (e.errorcode === 'servicenotavailable') hint = 'Servicios web o protocolo REST deshabilitados (README, paso 1).';
      else if (e.errorcode === 'accessexception') hint = 'Función no añadida al servicio, o tu usuario no tiene permiso para usar REST o no está autorizado en el servicio (README, pasos 2 y 3).';
      out.innerHTML = '<div class="fp-error">Error consultando la API: ' + esc(e.message) +
        (hint ? '<br><small>' + esc(hint) + '</small>' : '') + '</div>';
    });
}

function fundaeBuild(course, rawStudents, perStudent, contents, grades, canLogs) {
  var now = Math.floor(Date.now() / 1000);

  // El orden día/mes se decide con TODOS los registros del curso a la vez.
  var order = fundaeResolveDateOrder(perStudent.map(function (ps) { return ps.logparts; }));
  fundaeData.dateOrder = order;

  // Notas: `graderaw` para decidir si hay evaluación (numérico y estable) y
  // `gradeformatted` solo para mostrar. Comparar el texto contra «-» dependía
  // del idioma del sitio.
  var finalGrades = {};
  ((grades && grades.usergrades) || []).forEach(function (ug) {
    var gi = (ug.gradeitems || []).filter(function (g) { return g.itemtype === 'course'; })[0];
    finalGrades[ug.userid] = gi ? { raw: gi.graderaw, txt: gi.gradeformatted } : null;
  });

  var students = perStudent.map(function (ps) {
    var u = ps.user;
    var last = u.lastcourseaccess || u.lastaccess || 0;
    var pct = null;
    if (ps.actstatuses && ps.actstatuses.length) {
      var done = ps.actstatuses.filter(function (s) { return s.state === 1 || s.state === 2; }).length;
      pct = Math.round(done * 100 / ps.actstatuses.length);
    }
    var ses = ps.logparts === null ? null : fundaeSessions(fundaePartsToTs(ps.logparts, order.dayFirst));
    var g = finalGrades[u.id];
    return {
      uid: u.id,
      name: u.fullname,
      email: u.email || '',
      last: last,
      days: last ? Math.floor((now - last) / 86400) : null,
      pct: pct,
      time: ses === null ? null : ses.seconds,
      sessions: ses === null ? null : ses.sessions,
      byDay: ses === null ? null : fundaeByDay(ses.list),
      completed: ps.completion ? !!ps.completion.completed : null,
      grade: g && g.txt ? g.txt : null,
      graded: !!(g && g.raw !== null && g.raw !== undefined && g.raw !== '')
    };
  });

  var mods = [];
  (contents || []).forEach(function (sec) { (sec.modules || []).forEach(function (m) { mods.push(m); }); });
  var nEval = mods.filter(function (m) { return m.modname === 'quiz' || m.modname === 'assign'; }).length;
  var hasForum = mods.some(function (m) { return ['forum', 'chat', 'bigbluebuttonbn'].indexOf(m.modname) >= 0; });

  // --- Desglose por tipo de actividad/recurso y estado de calificación ---
  // El mapa de ítems se construye con la UNIÓN de todos los alumnos: tomarlo
  // del primero daba un inventario falso si a ese alumno le ocultaban ítems.
  var giByMod = {};
  ((grades && grades.usergrades) || []).forEach(function (ug) {
    (ug.gradeitems || []).forEach(function (gi) {
      if (gi.itemtype !== 'mod') return;
      var key = gi.itemmodule + ':' + gi.iteminstance;
      if (!giByMod[key] || (gi.grademax > 0 && !(giByMod[key].grademax > 0))) giByMod[key] = gi;
    });
  });
  var RESOURCES = ['resource', 'url', 'page', 'book', 'folder', 'label', 'imscp'];
  var GRADABLE = ['assign', 'quiz', 'scorm', 'forum', 'glossary', 'data', 'lesson', 'workshop', 'lti', 'h5pactivity', 'hvp'];
  var byType = {};
  mods.forEach(function (m) {
    var t = m.modname;
    if (!byType[t]) byType[t] = { type: t, label: m.modplural || m.modname, items: [] };
    var gi = giByMod[t + ':' + m.instance] || null;
    byType[t].items.push({
      name: m.name,
      graded: !!(gi && gi.grademax > 0),
      gmax: gi && gi.grademax > 0 ? gi.grademax : null
    });
  });
  var modtypes = Object.keys(byType).sort().map(function (t) {
    var g = byType[t];
    g.isResource = RESOURCES.indexOf(t) >= 0;
    g.isGradable = GRADABLE.indexOf(t) >= 0;
    g.nGraded = g.items.filter(function (it) { return it.graded; }).length;
    return g;
  });
  var scorm = byType.scorm || { items: [], nGraded: 0 };
  var nGradableActs = modtypes.filter(function (g) { return g.isGradable; })
    .reduce(function (a, g) { return a + g.items.length; }, 0);
  var nGradedActs = modtypes.filter(function (g) { return g.isGradable; })
    .reduce(function (a, g) { return a + g.nGraded; }, 0);

  var nAcc = students.filter(function (s) { return s.last > 0; }).length;
  var pctAccess = students.length ? Math.round(nAcc * 100 / students.length) : 0;
  var nDone = students.filter(function (s) { return s.completed === true; }).length;
  var completionEnabled = students.some(function (s) { return s.completed !== null; });
  var pctDone = students.length ? Math.round(nDone * 100 / students.length) : 0;
  var anyGraded = students.some(function (s) { return s.graded; });
  var pctTracking = students.some(function (s) { return s.pct !== null; });
  var nOver75 = students.filter(function (s) { return s.pct !== null && s.pct >= 75; }).length;
  var timeTracking = students.some(function (s) { return s.time !== null; });
  var totalTime = students.reduce(function (acc, s) { return acc + (s.time || 0); }, 0);

  fundaeData.course = course;
  fundaeData.students = students;
  fundaeData.modtypes = modtypes;
  fundaeData.canLogs = canLogs;
  fundaeData.totalStudents = rawStudents.length;
  fundaeData.truncated = rawStudents.length > students.length;
  fundaeData.summary = {
    nStudents: students.length, pctAccess: pctAccess, pctDone: pctDone, nEval: nEval,
    hasForum: hasForum, completionEnabled: completionEnabled, anyGraded: anyGraded,
    pctTracking: pctTracking, nOver75: nOver75, nAcc: nAcc, nDone: nDone,
    timeTracking: timeTracking, totalTime: totalTime,
    nScorm: scorm.items.length, scormGraded: scorm.nGraded,
    nGradableActs: nGradableActs, nGradedActs: nGradedActs
  };
  fundaeRenderShell();
}

function badge(status, txtOk, txtWarn, txtFail) {
  if (status === true)  return '<span class="badge fp-ok">' + esc(txtOk || 'Cumple') + '</span>';
  if (status === 'warn') return '<span class="badge fp-warn">' + esc(txtWarn || 'Atención') + '</span>';
  return '<span class="badge fp-fail">' + esc(txtFail || 'No cumple') + '</span>';
}

function progressBar(pct) {
  if (pct === null) return '<span class="fp-muted">n/d</span>';
  var cls = pct >= 75 ? 'fp-bar-ok' : (pct >= 40 ? 'fp-bar-warn' : 'fp-bar-fail');
  return '<div class="progress" title="' + pct + '%">' +
    '<div class="progress-bar ' + cls + '" style="width:' + pct + '%; min-width:2.4em;">' + pct + '%</div></div>';
}

/* Conexión: token personal del tutor                                  */
/* ------------------------------------------------------------------ */

// Moodle auto-crea un token por cada servicio autorizado al visitar la página
// de claves de seguridad (user/managetoken.php). El valor solo se muestra una
// vez, justo tras (re)generarlo. Replicamos ese gesto del propio tutor con su
// sesión (same-origin): localizamos el token del servicio SERVICE_NAME y
// forzamos su regeneración con el sesskey, lo que devuelve el valor en el HTML.
//
// IMPORTANTE: solo se toca la fila cuyo servicio coincide con SERVICE_NAME.
// El respaldo «si solo hay un token, usa ese» se ha eliminado: regeneraba el
// token de OTRO servicio (típicamente el de la app móvil del propio tutor) y
// se lo apropiaba, dejándole la app rota sin avisar.
function fundaeProvisionToken() {
  var base = M.cfg.wwwroot + '/user/managetoken.php';
  return fetch(base, { credentials: 'same-origin' })
    .then(function (r) { return r.text(); })
    .then(function (html) {
      var doc = new DOMParser().parseFromString(html, 'text/html');
      var link = fundaeFindServiceLink(doc, SERVICE_NAME);
      if (!link) throw new Error('no-service');
      var m = (link.getAttribute('href') || '').match(/tokenid=([^&]+)/);
      if (!m) throw new Error('no-tokenid');
      // Otra pestaña puede haber conectado mientras tanto: no regeneramos dos veces.
      var already = getToken();
      if (already) return null;
      var url = base + '?action=resetwstoken&tokenid=' + encodeURIComponent(m[1]) +
        '&confirm=1&sesskey=' + encodeURIComponent(M.cfg.sesskey);
      return fetch(url, { credentials: 'same-origin' }).then(function (r) { return r.text(); });
    })
    .then(function (html2) {
      if (html2 === null) return getToken();
      var tok = fundaeExtractToken(html2);
      if (tok) return tok;
      // Algunos temas renderizan el valor en una segunda carga (variable de sesión).
      return fetch(base, { credentials: 'same-origin' })
        .then(function (r) { return r.text(); })
        .then(function (h3) {
          var t = fundaeExtractToken(h3);
          if (!t) throw new Error('no-value');
          return t;
        });
    });
}

// Busca el enlace «Reiniciar» de la fila cuyo servicio es exactamente
// `service`. Primero exige coincidencia exacta de celda; si el tema añade
// texto alrededor, acepta que la fila lo contenga. Nunca devuelve una fila
// que no mencione el servicio.
function fundaeFindServiceLink(doc, service) {
  var links = Array.prototype.slice.call(doc.querySelectorAll('a[href*="resetwstoken"]'));
  var target = String(service).trim().toLowerCase();
  var loose = null;
  for (var i = 0; i < links.length; i++) {
    var row = links[i].closest ? links[i].closest('tr') : null;
    if (!row) continue;
    var cells = Array.prototype.slice.call(row.querySelectorAll('td, th'));
    for (var j = 0; j < cells.length; j++) {
      if (cells[j].textContent.replace(/\s+/g, ' ').trim().toLowerCase() === target) return links[i];
    }
    if (!loose && row.textContent.replace(/\s+/g, ' ').toLowerCase().indexOf(target) >= 0) loose = links[i];
  }
  return loose;
}

function fundaeExtractToken(html) {
  var doc = new DOMParser().parseFromString(html, 'text/html');
  var box = doc.querySelector('#copytoclipboardtoken');
  var txt = box ? box.textContent : '';
  var m = String(txt).match(/[a-f0-9]{32}/i);
  return m ? m[0] : '';
}

// Pantalla de conexión. La generación del token NO se dispara sola: regenerar
// invalida el token anterior, y eso no puede pasarle a nadie sin que lo pida.

  var w = M.cfg.wwwroot;

  document.getElementById('fp-body').innerHTML =

function fundaeSessionOnly() {
  return !!(document.getElementById('fp-token-session') || {}).checked;
}

function fundaeConnect() {
  var sessionOnly = fundaeSessionOnly();
  fundaeLoading('Conectando con Moodle con tu sesión…');
  fundaeProvisionToken().then(function (tok) {
    if (!tok) throw new Error('no-value');
    setToken(tok, sessionOnly);
    fundaeRun();
  }).catch(function (e) {
    var msg;
    if (e && e.message === 'no-service')
      msg = 'No hay ningún token del servicio «' + SERVICE_NAME + '» en tu cuenta. Pide al administrador que ' +
            'autorice tu usuario en ese servicio, o entra con una cuenta de tutor (las cuentas de administrador ' +
            'del sitio no reciben tokens automáticos). Por seguridad, el panel no toca tokens de otros servicios.';
    else
      msg = 'No hemos podido obtener tu token automáticamente. Puedes pegarlo a mano en «Conexión manual».';
    fundaeConnectScreen(msg);
  });
}

function fundaeTokenSave() {
  var v = (document.getElementById('fp-token-input').value || '').trim();
  if (!v) return;
  setToken(v, fundaeSessionOnly());
  fundaeRun();
}

function fundaeTokenForget() {
  setToken('');
  fundaeConnectScreen('Token borrado de este navegador.');
}

function fundaeDownloadCsv(lines, name) {
  var blob = new Blob(['﻿' + lines.join('\r\n')], { type: 'text/csv;charset=utf-8;' });
  var url = URL.createObjectURL(blob);
  var a = document.createElement('a');
  a.href = url;
  a.download = name + '-curso-' + (fundaeData.course ? fundaeData.course.id : '') + '.csv';
  a.style.display = 'none';
  document.body.appendChild(a); // Firefox exige que el enlace esté en el DOM
  a.click();
  setTimeout(function () { document.body.removeChild(a); URL.revokeObjectURL(url); }, 0);
}

// Neutraliza la inyección de fórmulas: los nombres vienen de usuarios de
// Moodle, y un alumno llamado «=HYPERLINK(...)» ejecutaría la fórmula en el
// Excel de quien abra la evidencia. Los números se dejan intactos para que
// Excel siga tratándolos como números.
function csvCell(v) {
  var s = String(v == null ? '' : v);
  if (/^[=+\-@\t\r]/.test(s) && !/^-?\d+([.,]\d+)?$/.test(s)) s = "'" + s;
  return '"' + s.replace(/"/g, '""') + '"';
}

// Aviso único por carga antes de sacar datos personales del navegador.
function fundaeCsvConsent() {
  if (fundaeData.csvWarned) return true;
  var ok = window.confirm(
    'El archivo contiene datos personales del alumnado: nombre, correo y patrón horario de conexión.\n\n' +
    'Descárgalo solo si tienes base legal para tratarlos y guárdalo según la política de tu entidad.\n\n' +
    '¿Continuar con la descarga?');
  if (ok) fundaeData.csvWarned = true;
  return ok;
}

function fundaeCsv() {
  var s = fundaeData.students;
  if (!s.length || !fundaeCsvConsent()) return;
  var head = ['Alumno', 'Email', 'Ultimo acceso', 'Dias sin acceso', 'Tiempo en curso (min)', 'Sesiones',
    'Progreso actividades (%)', 'Curso completado', 'Nota final'];
  var lines = [head.join(';')].concat(s.map(function (st) {
    return [st.name, st.email, st.last ? fmtDate(st.last) : 'Nunca',
      st.days === null ? '' : st.days,
      st.time === null ? '' : Math.round(st.time / 60),
      st.sessions === null ? '' : st.sessions,
      st.pct === null ? '' : st.pct,
      st.completed === null ? '' : (st.completed ? 'Si' : 'No'), st.grade || '']
      .map(csvCell).join(';');
  }));
  fundaeDownloadCsv(lines, 'evidencias-fundae');
}

// CSV con una fila por alumno y día: la evidencia de conexiones diarias.
function fundaeCsvDays() {
  var s = fundaeData.students;
  if (!s.length || !fundaeCsvConsent()) return;
  var head = ['Alumno', 'Email', 'Dia', 'Sesiones', 'Tiempo (min)'];
  var lines = [head.join(';')];
  s.forEach(function (st) {
    (st.byDay || []).forEach(function (d) {
      var parts = d.day.split('-');
      lines.push([st.name, st.email, parts[2] + '/' + parts[1] + '/' + parts[0],
        d.sessions, Math.round(d.seconds / 60)].map(csvCell).join(';'));
    });
  });
  if (lines.length === 1) return;
  fundaeDownloadCsv(lines, 'conexiones-diarias-fundae');
}

function fundaeHandle(ev) {
  var el = ev.target.closest ? ev.target.closest('[data-fp-action]') : null;
  if (!el) return;
  var fn = FUNDAE_ACTIONS[el.getAttribute('data-fp-action')];
  if (!fn) return;
  ev.preventDefault();
  fn(el);
}

function fundaeDebounce(fn, ms) {
  var t;
  return function () { clearTimeout(t); t = setTimeout(fn, ms); };
}

function fundaeBoot() {
  var root = document.getElementById('fundae-panel');
  if (!root) return;

  var tag = document.createElement('style');
  tag.textContent = FUNDAE_CSS;
  document.head.appendChild(tag);

  root.innerHTML =

    '<div class="fp-hero-top">' +
    '<h2>' + ic('📋') + ' Panel de evidencias FUNDAE</h2>' +

    '<button type="button" class="btn btn-sm fp-btn-ghost" data-fp-action="csv">⬇ CSV resumen</button>' +
    '<button type="button" class="btn btn-sm fp-btn-ghost" data-fp-action="csv-days">⬇ CSV por días</button>' +

    '<div class="fp-sub" id="fp-timestamp"></div>' +
    '</div>' +
    '<div id="fp-body"></div>';

  root.addEventListener('click', fundaeHandle);
  root.addEventListener('keydown', function (ev) {
    if (ev.key !== 'Enter' && ev.key !== ' ') return;
    var el = ev.target.closest ? ev.target.closest('[data-fp-action]') : null;
    if (el && el.tagName === 'TH') fundaeHandle(ev);
    if (ev.target.id === 'fp-token-input' && ev.key === 'Enter') { ev.preventDefault(); fundaeTokenSave(); }
  });
  var debounced = fundaeDebounce(fundaeRenderTables, 150);
  root.addEventListener('input', function (ev) {
    if (ev.target.id === 'fp-filter' || ev.target.id === 'fp-modfilter') debounced();
  });

  // Guarda de rol: el alumnado no tiene report/log:view. Sin esta comprobación,
  // un estudiante que abriera la página vería la pantalla de conexión.
  var courseid = fundaeCourseId();
  if (!courseid) { fundaeRun(); return; }
  if (getToken()) { fundaeRun(); return; }
  fundaeLoading('Comprobando permisos…');
  fundaeCanViewLogs(courseid).then(function (ok) {
    if (ok) { fundaeRun(); return; }
    document.getElementById('fp-body').innerHTML =
      '<div class="card fp-card"><div class="card-body">' +
      '<p>Este panel muestra el seguimiento del curso y está destinado al profesorado. ' +

      '<button type="button" class="fp-tg" data-fp-action="refresh">continúa de todos modos</button>.</p>' +
      '</div></div>';
  });
}
